# Keep dependencies current across every ecosystem this repo ships.
#   - npm            : the pnpm frontend workspace (frontend/, pnpm-lock.yaml)
#   - github-actions : the workflows under .github/workflows/
# Weekly, except our own @gainratio/* libraries: they get their own daily entry
# so the bump PR opens the day after each release (apps track our latest).
# aml-filter is frontend-only — there is no Python / pip ecosystem.
# Dependabot's "npm" ecosystem natively understands pnpm-lock.yaml.
# Each ecosystem is GROUPED into a single consolidated PR per run, so updates
# arrive as one reviewable PR instead of a flood of one-per-dependency PRs.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # transformers.js >=4.3.0 pulls onnxruntime-web 1.31.0-dev, whose
    # ort-wasm-simd-threaded.asyncify.wasm (26,861,777 B) exceeds the Cloudflare
    # Pages 25 MiB per-file limit the self-hosted runtime must fit
    # (app/scripts/stage-ort-wasm.test.ts). Held at exactly 4.2.0 in #131.
    # Drop this entry once a release's asyncify wasm is < 26,214,400 B.
    ignore:
      # Owned by the daily @gainratio entry below; keep them out of this PR.
      - dependency-name: "@gainratio/*"
      - dependency-name: "@huggingface/transformers"
        versions: [">=4.3.0"]
      # undici 8 requires Node >=22.19.0 and rejects Node 22's built-in fetch
      # handler (InvalidArgumentError: invalid onRequestStart method,
      # feedDispatcher.test.ts). Remove once frontend/.nvmrc moves to >=22.19
      # and fetchWithTimeout.ts imports fetch from undici. Supersedes #172.
      - dependency-name: "undici"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Our own libraries, daily and in their own PR, all update types (no caps).
  # Dependabot needs a unique (ecosystem, directory, target-branch) per entry,
  # so this one names target-branch explicitly to sit beside the weekly entry.
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "main"
    schedule:
      interval: "daily"
    allow:
      - dependency-name: "@gainratio/*"
    groups:
      gainratio:
        patterns: ["@gainratio/*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
