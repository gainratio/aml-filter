packages:
  - app
  - packages/*

# pnpm 11 defaults this to 1440 minutes. Set zero explicitly so clean CI and
# warm local installs both apply the project's no-release-delay policy.
minimumReleaseAge: 0

# pnpm v11 does not run a dependency's build/postinstall scripts unless it is
# explicitly allowlisted here (replaces v10's onlyBuiltDependencies). esbuild is
# Vite's bundler and ships a native binary whose postinstall must run for
# `vite build` / `vitest` to work. The transitive native deps of
# @huggingface/transformers (the in-browser MiniLM embedder) are needed by the
# node-side embedding parity tests: onnxruntime-node is the native ONNX backend,
# protobufjs compiles its proto bindings, sharp builds its native image binary.
allowBuilds:
  "@gainratio/browser": false # npm tarball ships a built dist/; never run its dev prepare
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  workerd: true # Wrangler's pinned local runtime binary

# Pin transitive protobufjs to the patched 7.x line. It is pulled in transitively
# via @huggingface/transformers > onnxruntime-web, so it is overridden here.
#
# The floor was `>=7.6.3` (for GHSA-f38q-mgvj-vph7, vulnerable <=7.6.2). That
# range was UNBOUNDED, so pnpm resolved it forward to 8.6.4 — a silent runtime
# major bump that (a) violates onnxruntime-web's declared `protobufjs: ^7.2.4`
# and (b) landed on a version carrying two live advisories:
#   GHSA-jfj6-75fj-8934  vulnerable >=8.2.0 <=8.6.4
#   GHSA-j3f2-48v5-ccww  vulnerable >=8.0.0 <=8.6.5  (DoS, .proto option parsing)
# Adding the `<8` bound pulls resolution back to 7.6.5 — the patched 7.x line
# (npm `latest-7`), which clears f38q, j3f2 (7.x range is <=7.6.4) and jfj6, and
# restores semver compatibility with the engine's declared range.
#
# Pin transitive sharp to the patched 0.35.x line. It is pulled in transitively
# via @huggingface/transformers (declared `sharp: ^0.34.5`, which caps at 0.34.x),
# so it is overridden here. Versions <0.35.0 ship libvips 1.2.x, which carries
# four high-severity CVEs (2026-33327/33328/35590/35591). 0.35.0 bumps libvips to
# 1.3.0, which patches all four. sharp is only exercised by transformers' Node
# image models (this app does text-only embeddings), so the bump is API-safe here.
# The 0.35.4 floor also includes patched libheif builds for GHSA-rgj7-g3m4-5g8c.
# The 0.35.5 floor patches librsvg for GHSA-wq5f-xc86-pv6w (CVE-2026-96889,
# vulnerable <0.35.5). The audited path is wrangler>miniflare>sharp, and miniflare
# pins sharp EXACTLY at 0.35.4, so no direct bump reaches it.
#
# Pin transitive source-map-js to the patched 1.x line for GHSA-68fv-2mgg-jv7q
# (event-loop DoS via indexed source-map section offsets; vulnerable >=1.0.0
# <1.2.2). It is reached only through dev tooling (jsdom>css-tree, postcss, vite),
# whose parents declare `^1.x` ranges, so there is no direct dependency to bump.
# Bounded `<2`: a floor inside the patched 1.x line, not a major upgrade.
#
# Pin transitive postcss to the patched 8.5.18+ line for GHSA-r28c-9q8g-f849
# (path traversal in previous-source-map auto-loading via `sourceMappingURL`,
# leaking arbitrary .map files; vulnerable <=8.5.17, patched >=8.5.18). postcss is
# reached only through vite — app>@vitejs/plugin-react>vite>postcss and the
# vitest copies of that same vite — which declares `postcss: ^8.5.x`, so there is
# no direct dependency to bump instead. Bounded `<9`: a floor inside the patched
# 8.x line, not a major upgrade.
#
# Pin transitive nanoid to the patched 3.x line for GHSA-2v37-7h3g-55p8.
# Vite reaches nanoid through PostCSS; versions before 3.3.17 can loop forever
# for a zero-size custom alphabet request. The `<4` ceiling avoids a silent
# transitive major-version jump.
#
# Pin transitive undici to 7.29.1 for GHSA-3wwx-pv8p-q78v (DoS via an unhandled
# error in WebSocket permessage-deflate decompression; vulnerable >=7.28.0
# <7.29.1). wrangler>miniflare pins undici EXACTLY at 7.29.0, so no direct bump
# reaches it. The selector only rewrites the vulnerable 7.x range; the separate
# undici 8.x copy is untouched. The advisory turned main CI red on 2026-09-29
# (`pnpm audit --audit-level low`), which silently skipped the deploy and blocked
# every watchlist publish (they require an exact-green main).
# Keep ONE @hpcc-js/wasm-zstd copy at 1.16.2. @gainratio/browser (^0.4.1 from npm) declares
# `^1.16.1` and its own gate runs 1.16.2; the app ships one copy of that exact
# build instead of two (almamesh pins the same version).
overrides:
  "@hpcc-js/wasm-zstd": "1.16.2"
  adm-zip: "0.6.1"
  protobufjs: ">=7.6.5 <8"
  sharp: "^0.35.5"
  source-map-js: ">=1.2.2 <2"
  postcss: ">=8.5.18 <9"
  nanoid: ">=3.3.17 <4"
  "undici@>=7.28.0 <7.29.1": "7.29.1"

# Backport of three SQLite check-ins into the opfs-sahpool VFS that holds the
# workstation's KYC database (ext/wasm/api/sqlite3-vfs-opfs-sahpool.c-pp.js):
#   9168a6f1be (GitHub a614ce42, forum b2fbb61642) xCheckReservedLock read a
#     hard-coded RESERVED lock, so SQLite never rolled back a hot journal: a tab
#     killed mid-transaction left a torn database integrity_check called "ok".
#   9e2caaa382 (GitHub 3b28aa1c) a per-path lock table, so a second handle on the
#     same file gets SQLITE_BUSY; releaseAccessHandles clears both maps.
#   c9dd4d88e4 (GitHub cdbfe6a9, forum 3f0794c5d8) xSleep is a no-op: now that
#     xLock can return BUSY, an inherited sleeping xSleep froze the worker for the
#     whole busy_timeout.
# No npm build carries them yet (3.53.4-build2 is cut from a 2026-07-24 source).
# Drop this patch when the dependency is bumped to a build that includes all
# three; pnpm fails the install on an unused patch, and
# tests/e2e-kyc/sahpool-crash-rollback.spec.ts goes red on an unfixed build.
patchedDependencies:
  '@sqlite.org/sqlite-wasm@3.53.4-build2': patches/@sqlite.org__sqlite-wasm@3.53.4-build2.patch
